<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Catcher — Neon Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #050510; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; }
  h1 { color: #0ff; text-shadow: 0 0 10px #0ff, 0 0 30px #0ff; font-size: 34px; letter-spacing: 4px; text-transform: uppercase; }
  #hud { display: flex; gap: 28px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 0 8px #f0f; }
  #hud span { min-width: 90px; text-align: center; }
  #hud .lbl { color: #888; font-size: 13px; display: block; letter-spacing: 2px; }
  #score { color: #0ff; } #lives { color: #ff2d78; } #time { color: #ffe600; }
  canvas { background: radial-gradient(ellipse at center, #0a0a2e 0%, #050510 70%); border: 2px solid #0ff; border-radius: 10px;
    box-shadow: 0 0 25px rgba(0,255,255,.45), inset 0 0 40px rgba(0,255,255,.08); cursor: none; }
  #hint { color: #666; font-size: 14px; }
  #gameArea { position: relative; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: rgba(5,5,16,.82); color: #fff; text-align: center; z-index: 10; }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 44px; color: #ffe600; text-shadow: 0 0 15px #ffe600, 0 0 45px #ff8800; letter-spacing: 3px; }
  #overlay p { font-size: 20px; color: #ccc; }
  #overlay p b { color: #0ff; font-size: 28px; }
  #restart { padding: 14px 42px; font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #050510; background: #0ff;
    border: none; border-radius: 40px; cursor: pointer; box-shadow: 0 0 20px #0ff; transition: transform .1s, box-shadow .1s; }
  #restart:hover { transform: scale(1.06); box-shadow: 0 0 32px #0ff; }
</style>
</head>
<body>
<div id="wrap">
  <h1>&#9733; Star Catcher &#9733;</h1>
  <div id="hud">
    <span><span class="lbl">SCORE</span><span id="score">0</span></span>
    <span><span class="lbl">LIVES</span><span id="lives">&#10084;&#10084;&#10084;</span></span>
    <span><span class="lbl">TIME</span><span id="time">60</span></span>
  </div>
  <div id="gameArea">
    <canvas id="game" width="480" height="560"></canvas>
    <div id="overlay" class="hidden">
      <h2 id="overTitle">GAME OVER</h2>
      <p>Final score: <b id="finalScore">0</b></p>
      <p id="overMsg"></p>
      <button id="restart">PLAY AGAIN</button>
    </div>
  </div>
  <div id="hint">Move: &larr; &rarr; arrow keys or mouse &nbsp;|&nbsp; &#9733; star = 10 pts &nbsp;|&nbsp; &#9733; golden star = 50 pts &nbsp;|&nbsp; Miss = lose a life</div>
</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var scoreEl = document.getElementById("score"), livesEl = document.getElementById("lives"),
      timeEl = document.getElementById("time"), overlay = document.getElementById("overlay"),
      overTitle = document.getElementById("overTitle"), finalScoreEl = document.getElementById("finalScore"),
      overMsg = document.getElementById("overMsg"), restartBtn = document.getElementById("restart");
  var BASKET_W = 90, BASKET_H = 16, BASKET_Y = H - 34, GAME_TIME = 60;
  var state = "playing";
  var basket = { x: W / 2 - BASKET_W / 2 };
  var stars = [], particles = [];
  var score = 0, lives = 3, timeLeft = GAME_TIME, spawnTimer = 0, spawnInterval = 650;
  var lastTime = performance.now(), elapsed = 0, keys = {};
  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }
  function rand(min, max) { return min + Math.random() * (max - min); }
  window.addEventListener("keydown", function (e) {
    keys[e.key] = true;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });
  canvas.addEventListener("mousemove", function (e) {
    var rect = canvas.getBoundingClientRect();
    basket.x = clamp((e.clientX - rect.left) * (W / rect.width) - BASKET_W / 2, 0, W - BASKET_W);
  });
  restartBtn.addEventListener("click", resetGame);
  function resetGame() {
    score = 0; lives = 3; timeLeft = GAME_TIME; stars = []; particles = [];
    basket.x = W / 2 - BASKET_W / 2; spawnInterval = 650; elapsed = 0;
    overlay.classList.add("hidden"); state = "playing"; lastTime = performance.now(); updateHud();
  }
  function updateHud() {
    scoreEl.textContent = score;
    livesEl.textContent = lives > 0 ? "\u2764".repeat(lives) : "\u2014";
    timeEl.textContent = Math.max(Math.ceil(timeLeft), 0);
  }
  function spawnStar() {
    var golden = Math.random() < 0.15;
    stars.push({ x: rand(20, W - 20), y: -20, r: golden ? 13 : rand(8, 12),
      vy: rand(140, 220) + elapsed * 1.6, vx: rand(-25, 25), golden: golden,
      rot: rand(0, Math.PI * 2), rotSpeed: rand(-2, 2), twinkle: rand(0, Math.PI * 2) });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = rand(0, Math.PI * 2), sp = rand(40, 180);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5, maxLife: 0.5, color: color, r: rand(2, 4) });
    }
  }
  function drawStar(x, y, r, rot, color, glow) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.shadowColor = glow; ctx.shadowBlur = 16; ctx.fillStyle = color; ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = (i % 2 === 0) ? r : r * 0.45, a = (i * Math.PI) / 5 - Math.PI / 2;
      var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawBasket() {
    var x = basket.x, y = BASKET_Y;
    ctx.save(); ctx.shadowColor = "#0ff"; ctx.shadowBlur = 18;
    var grad = ctx.createLinearGradient(x, y, x, y + BASKET_H + 14);
    grad.addColorStop(0, "#00e5ff"); grad.addColorStop(1, "#0077ff");
    ctx.fillStyle = grad; ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + BASKET_W, y);
    ctx.lineTo(x + BASKET_W - 10, y + BASKET_H + 8); ctx.lineTo(x + 10, y + BASKET_H + 8);
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(x + BASKET_W / 3, y + 2); ctx.lineTo(x + BASKET_W / 3 - 4, y + BASKET_H + 6);
    ctx.moveTo(x + 2 * BASKET_W / 3, y + 2); ctx.lineTo(x + 2 * BASKET_W / 3 + 4, y + BASKET_H + 6);
    ctx.stroke();
    ctx.fillStyle = "#bffcff"; ctx.fillRect(x - 2, y - 3, BASKET_W + 4, 5); ctx.restore();
  }
  function gameOver(win) {
    state = "over";
    overTitle.textContent = win ? "TIME'S UP!" : "GAME OVER";
    finalScoreEl.textContent = score;
    overMsg.textContent = win ? "You survived the full 60 seconds!" : "Out of lives — the stars got away...";
    overlay.classList.remove("hidden");
  }
  function update(dt) {
    elapsed += dt; timeLeft -= dt;
    if (Math.ceil(timeLeft) !== Math.ceil(timeLeft + dt)) updateHud(); // tick the displayed second
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); gameOver(true); return; }
    var speed = 420;
    if (keys["ArrowLeft"] || keys["a"]) basket.x -= speed * dt;
    if (keys["ArrowRight"] || keys["d"]) basket.x += speed * dt;
    basket.x = clamp(basket.x, 0, W - BASKET_W);
    spawnTimer += dt * 1000;
    spawnInterval = Math.max(650 - elapsed * 6, 260);
    if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnStar(); }
    for (var i = stars.length - 1; i >= 0; i--) {
      var s = stars[i];
      s.y += s.vy * dt; s.x += s.vx * dt; s.rot += s.rotSpeed * dt; s.twinkle += dt * 6;
      if (s.y + s.r >= BASKET_Y && s.y <= BASKET_Y + BASKET_H + 10 &&
          s.x >= basket.x - 4 && s.x <= basket.x + BASKET_W + 4) {
        score += s.golden ? 50 : 10;
        burst(s.x, s.y, s.golden ? "#ffe600" : "#0ff", s.golden ? 18 : 10);
        stars.splice(i, 1); updateHud(); continue;
      }
      if (s.y - s.r > H) {
        stars.splice(i, 1); lives -= 1;
        burst(s.x, H - 10, "#ff2d78", 12); updateHud();
        if (lives <= 0) { gameOver(false); return; }
      }
    }
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.25)";
    for (var i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 173) % H, 2, 2);
    for (var k = 0; k < stars.length; k++) {
      var s = stars[k];
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(s.twinkle);
      drawStar(s.x, s.y, s.r, s.rot, s.golden ? "#ffe600" : "#7df9ff", s.golden ? "#ff8800" : "#00e5ff");
    }
    ctx.globalAlpha = 1;
    for (var j = 0; j < particles.length; j++) {
      var p = particles[j];
      ctx.globalAlpha = Math.max(p.life / p.maxLife, 0); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawBasket();
    ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(10, 10, W - 20, 6);
    ctx.fillStyle = timeLeft > 10 ? "#0ff" : "#ff2d78";
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    ctx.fillRect(10, 10, (W - 20) * (timeLeft / GAME_TIME), 6); ctx.shadowBlur = 0;
  }
  function loop(now) {
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (state === "playing") update(dt);
    render();
    requestAnimationFrame(loop);
  }
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
